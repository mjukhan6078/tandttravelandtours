services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tandt-travel
    ports:
      - "3090:3000"
      # MinIO console UI only (API stays internal on 127.0.0.1:9000)
      - "9002:9001"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Public site URL (your NPM / DNS domain), e.g. https://travel.example.com
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.tandttravelandtours.com}
      # Optional override. Leave unset to auto-detect from request (http vs https).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASS: ${DASHBOARD_PASS:-admin}
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Junaid6078
      # App S3 SDK credentials (same as root user)
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Junaid6078
      MINIO_BUCKET: tandt-travel
      MINIO_REGION: us-east-1
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
