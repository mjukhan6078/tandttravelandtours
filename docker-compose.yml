services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tandt-travel
    ports:
      - "3090:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DASHBOARD_SESSION_TOKEN: tandt-admin-session-v1
    volumes:
      - tandt_data:/app/data
    restart: unless-stopped

volumes:
  tandt_data:
