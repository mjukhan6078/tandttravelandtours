services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tandt-travel
    ports:
      - "3090:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.tandttravelandtours.com}
    volumes:
      - inquire_data:/app/.data
    restart: unless-stopped

volumes:
  inquire_data:
